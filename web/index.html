<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apoyo escolar en Tandil desde 2001: primaria, secundaria, terciario e ingreso. Clases en grupo o individuales, presenciales u online." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El Tintero" />
    <meta property="og:title" content="El Tintero · Apoyo escolar en Tandil" />
    <meta property="og:description" content="Primaria, secundaria, terciario e ingreso. Reservá tu clase online." />
    <meta property="og:image" content="%VITE_SITIO%/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- las tipografías no frenan el primer dibujo: se cargan aparte y se cambian al llegar (display=swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&family=Lexend+Mega:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&family=Lexend+Mega:wght@500&family=Public+Sans:wght@400;500;600;700&display=swap" /></noscript>
    <script>
      // El diseño de escritorio mide 1440: entre 1024 y 1440 se escala para que entre igual que en Figma.
      (function () {
        var r = document.documentElement;
        function escala() { r.style.setProperty("--escala", Math.max(r.clientWidth, 1024) / 1440); r.style.setProperty("--escala-panel", r.clientWidth / 1440); }
        escala(); window.addEventListener("resize", escala);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
